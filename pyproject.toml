[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-fyers-algo"
version = "0.1.0"
description = "Auditable, safety-first TradingView and FYERS trading application scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
dashboard = ["streamlit>=1.40", "python-dotenv>=1.0,<2.0"]
test = ["httpx>=0.27,<1.0"]
fyers = ["fyers-apiv3>=3.1,<4"]

[project.scripts]
nifty-algo-dashboard = "nifty_algo.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
